name: learning-setu
x-app: &app
  image: learning-setu:local
  build:
    context: .
    dockerfile: app/Dockerfile
    target: runtime
  environment: &env
    APP_ENV: local
    AUTH_MODE: local
    TRANSCRIPTION_PROVIDER: mock
    WORKER_MODE: all
    LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:-synthetic-local-only-secret-never-use-in-production}
    AWS_REGION: ap-south-1
    CONTROL_TABLE: setu-control-local
    DOCUMENT_BUCKET: setu-documents-local
    RESOURCE_PREFIX: setu-local
    DYNAMODB_ENDPOINT: http://dynamodb:8000
    S3_ENDPOINT: http://s3:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    APP_ORIGIN: http://localhost:8080
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
  read_only: true
  tmpfs: [/tmp]
services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports: ["127.0.0.1:8100:8000"]
  s3:
    # S3-compatible emulator, including object versions and presigned uploads.
    image: motoserver/moto:5.1.15
    environment: {MOTO_PORT: "9000"}
    ports: ["127.0.0.1:9000:9000"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  seed:
    <<: *app
    command: [seed]
    depends_on: [dynamodb, s3, mailpit]
  api:
    <<: *app
    command: [api]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /usr/local/bin/setu, health]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    <<: *app
    command: [worker]
    depends_on:
      seed: {condition: service_completed_successfully}
  frontend:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
