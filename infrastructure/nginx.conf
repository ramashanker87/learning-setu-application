server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 12m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:9000; media-src 'self' blob: http://localhost:9000; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/ { set $backend http://api:3000; proxy_pass $backend$request_uri; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
