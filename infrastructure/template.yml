        ReadonlyRootFilesystem: true
        MountPoints:
        - SourceVolume: temporary
          ContainerPath: /tmp
          ReadOnly: false
        HealthCheck:
          Command:
          - CMD
          - /usr/local/bin/setu
          - health
          Interval: 30
          Timeout: 5
          Retries: 3
          StartPeriod: 20
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      Volumes:
